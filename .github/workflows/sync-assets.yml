name: Sync assets to R2

on:
  push:
    branches: [main]
    paths:
      - 'assets/images/**'
      - '.github/workflows/sync-assets.yml'

concurrency:
  group: r2-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Upload images to Cloudflare R2
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Configure rclone for R2
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = ${{ secrets.R2_ENDPOINT }}
          acl = public-read
          no_check_bucket = true
          EOF

      - name: Verify rclone config
        run: rclone about r2:${{ secrets.R2_BUCKET }} || true

      - name: Sync assets/images → R2 bucket
        run: |
          set -e
          if [ ! -d "assets/images" ]; then
            echo "::warning::assets/images/ not found, nothing to sync"
            exit 0
          fi
          echo "::group::Syncing files"
          rclone sync ./assets/images "r2:${{ secrets.R2_BUCKET }}" \
            --progress \
            --transfers 8 \
            --checkers 16 \
            --exclude ".DS_Store" \
            --exclude "Thumbs.db"
          echo "::endgroup::"

      - name: Summary
        if: success()
        run: |
          echo "✔ R2 sync complete"
          echo "🔗 Public URL pattern: ${{ secrets.R2_PUBLIC_URL }}/<file-path>"

      - name: Error report
        if: failure()
        run: |
          echo "❌ R2 sync failed"
          echo "请检查 GitHub Secrets 是否都正确配置：R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_ENDPOINT / R2_BUCKET"
